<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acervo Bibliográfico - Consulta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }

    h1 span {
      color: var(--primary);
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .search-box {
      margin: 0 auto 2rem auto;
      max-width: 650px;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      border: 2px solid var(--border);
      border-radius: 50px;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.15);
    }

    .status-msg {
      margin-bottom: 1.5rem;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      border-top: 5px solid #eab308;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .tag-codigo {
      display: inline-block;
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }

    .card-author {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .tag-assunto {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 500;
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      margin-bottom: 1rem;
    }

    .card-footer {
      border-top: 1px dashed var(--border);
      padding-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Acervo <span>Bibliográfico</span></h1>
      <p>Pesquise por Título, Autor, Assunto ou Código de Localização</p>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Carregando acervo..." disabled>
    </div>

    <div id="statusMsg" class="status-msg">Carregando dados...</div>

    <div id="resultsGrid" class="grid"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxkLzHZcm-9pAgHMLwAD4upBuun1CL5z34E4k_Ima75vYsRJ29naDhHGw4_Ai5NKouE/exec";
    
    let allBooks = [];
    const searchInput = document.getElementById('searchInput');
    const statusMsg = document.getElementById('statusMsg');
    const resultsGrid = document.getElementById('resultsGrid');

    async function loadData() {
      try {
        const response = await fetch(API_URL);
        allBooks = await response.json();
        
        // Habilita a caixa de busca
        searchInput.disabled = false;
        searchInput.placeholder = "Digite para pesquisar...";
        
        // Mensagem inicial e tela limpa
        statusMsg.innerText = "Digite algum termo no campo acima para pesquisar no acervo.";
        resultsGrid.innerHTML = "";
      } catch (error) {
        console.error(error);
        statusMsg.innerText = "Erro ao carregar os dados do acervo. Tente recarregar a página.";
      }
    }

    function handleSearch() {
      const query = searchInput.value.trim().toLowerCase();

      // Se o campo de pesquisa estiver vazio, limpa a tela
      if (query === "") {
        statusMsg.innerText = "Digite algum termo no campo acima para pesquisar no acervo.";
        resultsGrid.innerHTML = "";
        return;
      }

      // Filtra os livros cadastrados
      const filtered = allBooks.filter(book => {
        return (
          (book.titulo && book.titulo.toLowerCase().includes(query)) ||
          (book.autor && book.autor.toLowerCase().includes(query)) ||
          (book.assunto && book.assunto.toLowerCase().includes(query)) ||
          (book.codigo && book.codigo.toLowerCase().includes(query))
        );
      });

      // Atualiza o contador de resultados
      if (filtered.length > 0) {
        statusMsg.innerText = `${filtered.length} item(ns) encontrado(s)`;
      } else {
        statusMsg.innerText = "Nenhum livro encontrado com esse termo.";
      }

      // Renderiza os cartões encontrados
      renderBooks(filtered);
    }

    function renderBooks(books) {
      resultsGrid.innerHTML = books.map(book => `
        <div class="card">
          <div>
            ${book.codigo ? `<span class="tag-codigo">📍 ${book.codigo}</span>` : ''}
            <div class="card-title">${book.titulo || 'Sem título'}</div>
            <div class="card-author">${book.autor || 'Autor não informado'}</div>
            ${book.assunto ? `<span class="tag-assunto">📚 ${book.assunto}</span>` : ''}
          </div>
          <div class="card-footer">
            <span>Lombada:</span>
            <strong>${book.corLombada || 'Não informada'}</strong>
          </div>
        </div>
      `).join('');
    }

    searchInput.addEventListener('input', handleSearch);

    // Inicia o carregamento dos dados
    loadData();
  </script>
</body>
</html>
