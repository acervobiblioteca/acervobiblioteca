<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acervo Bibliográfico - Consulta Inteligente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }

    h1 span {
      color: var(--primary);
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .search-container {
      position: relative;
      max-width: 650px;
      margin: 0 auto 1.5rem auto;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      border: 2px solid var(--border);
      border-radius: 50px;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.15);
    }

    .suggestions-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-top: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      overflow: hidden;
      display: none;
    }

    .suggestion-item {
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.95rem;
    }

    .suggestion-item:hover {
      background-color: #eff6ff;
      color: var(--primary);
    }

    .suggestion-type {
      font-size: 0.75rem;
      background: #f1f5f9;
      color: #64748b;
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      font-weight: 600;
    }

    .did-you-mean {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 0.85rem 1.25rem;
      border-radius: 12px;
      margin: 0 auto 1.5rem auto;
      max-width: 650px;
      font-size: 0.95rem;
      display: none;
    }

    .did-you-mean span {
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      color: #15803d;
    }

    .status-msg {
      margin-bottom: 1.5rem;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      border-top: 5px solid #eab308;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .card-body {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .card-info {
      flex: 1;
    }

    .cover-frame {
      width: 90px;
      height: 125px;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      background-color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .cover-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-placeholder {
      font-size: 1.8rem;
      color: #94a3b8;
    }

    .hide-img {
      display: none !important;
    }

    .hide-placeholder {
      display: none !important;
    }

    .tag-codigo {
      display: inline-block;
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      margin-bottom: 0.6rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.3rem;
      line-height: 1.3;
    }

    .card-author {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }

    .tag-assunto {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 500;
      font-size: 0.78rem;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }

    .card-footer {
      border-top: 1px dashed var(--border);
      padding-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Acervo <span>Bibliográfico</span></h1>
      <p>Pesquise por Título, Autor, Assunto ou Código de Localização</p>
    </header>

    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Carregando acervo..." disabled autocomplete="off">
      <div id="suggestionsBox" class="suggestions-box"></div>
    </div>

    <div id="didYouMean" class="did-you-mean">
      💡 Nenhum resultado exato encontrado. Você quis dizer: <span id="suggestionTerm"></span>?
    </div>

    <div id="statusMsg" class="status-msg">Carregando dados...</div>

    <div id="resultsGrid" class="grid"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxkLzHZcm-9pAgHMLwAD4upBuun1CL5z34E4k_Ima75vYsRJ29naDhHGw4_Ai5NKouE/exec";
    
    let allBooks = [];
    let searchTermsCatalog = [];

    const searchInput = document.getElementById('searchInput');
    const suggestionsBox = document.getElementById('suggestionsBox');
    const didYouMean = document.getElementById('didYouMean');
    const suggestionTerm = document.getElementById('suggestionTerm');
    const statusMsg = document.getElementById('statusMsg');
    const resultsGrid = document.getElementById('resultsGrid');

    function normalizeText(str) {
      return (str || '')
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function levenshteinDistance(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    async function loadData() {
      try {
        const response = await fetch(API_URL);
        allBooks = await response.json();
        
        const termsMap = new Map();
        allBooks.forEach(b => {
          if (b.autor) termsMap.set(b.autor.trim(), 'Autor');
          if (b.titulo) termsMap.set(b.titulo.trim(), 'Título');
          if (b.assunto) termsMap.set(b.assunto.trim(), 'Assunto');
        });
        
        searchTermsCatalog = Array.from(termsMap.entries()).map(([term, type]) => ({
          term,
          type,
          normalized: normalizeText(term)
        }));

        searchInput.disabled = false;
        searchInput.placeholder = "Digite para pesquisar...";
        statusMsg.innerText = "Digite algum termo no campo acima para pesquisar no acervo.";
      } catch (error) {
        console.error(error);
        statusMsg.innerText = "Erro ao carregar os dados do acervo. Tente recarregar a página.";
      }
    }

    function handleSearch(customQuery = null) {
      const queryRaw = customQuery !== null ? customQuery : searchInput.value;
      const query = normalizeText(queryRaw);

      suggestionsBox.style.display = 'none';
      didYouMean.style.display = 'none';

      if (query === "") {
        statusMsg.innerText = "Digite algum termo no campo acima para pesquisar no acervo.";
        resultsGrid.innerHTML = "";
        return;
      }

      let filtered = allBooks.filter(book => {
        return (
          normalizeText(book.titulo).includes(query) ||
          normalizeText(book.autor).includes(query) ||
          normalizeText(book.assunto).includes(query) ||
          normalizeText(book.codigo).includes(query)
        );
      });

      if (filtered.length === 0 && query.length >= 3) {
        let bestMatch = null;
        let lowestDistance = Infinity;

        searchTermsCatalog.forEach(item => {
          const dist = levenshteinDistance(query, item.normalized);
          if (dist < lowestDistance && dist <= 3) {
            lowestDistance = dist;
            bestMatch = item;
          }
        });

        if (bestMatch) {
          suggestionTerm.innerText = bestMatch.term;
          didYouMean.style.display = 'block';
          
          suggestionTerm.onclick = () => {
            searchInput.value = bestMatch.term;
            handleSearch(bestMatch.term);
          };

          filtered = allBooks.filter(book => {
            return (
              normalizeText(book.titulo).includes(bestMatch.normalized) ||
              normalizeText(book.autor).includes(bestMatch.normalized) ||
              normalizeText(book.assunto).includes(bestMatch.normalized)
            );
          });
        }
      }

      if (filtered.length > 0) {
        statusMsg.innerText = `${filtered.length} item(ns) encontrado(s)`;
      } else {
        statusMsg.innerText = "Nenhum livro encontrado com esse termo.";
      }

      renderBooks(filtered);
    }

    function showAutocomplete() {
      const query = normalizeText(searchInput.value);
      
      if (query.length < 2) {
        suggestionsBox.style.display = 'none';
        return;
      }

      const matches = searchTermsCatalog
        .filter(item => item.normalized.includes(query))
        .slice(0, 5);

      if (matches.length === 0) {
        suggestionsBox.style.display = 'none';
        return;
      }

      suggestionsBox.innerHTML = matches.map(item => `
        <div class="suggestion-item" data-value="${item.term}">
          <span>${item.term}</span>
          <span class="suggestion-type">${item.type}</span>
        </div>
      `).join('');

      suggestionsBox.style.display = 'block';

      document.querySelectorAll('.suggestion-item').forEach(el => {
        el.addEventListener('click', () => {
          const val = el.getAttribute('data-value');
          searchInput.value = val;
          handleSearch(val);
        });
      });
    }

    function renderBooks(books) {
      resultsGrid.innerHTML = books.map(book => {
        let rawUrl = (book.capaUrl || '').trim().replace(/\s+/g, '');
        
        // Adiciona https:// automaticamente caso o link tenha sido colado sem o protocolo
        if (rawUrl && !rawUrl.startsWith('http://') && !rawUrl.startsWith('https://')) {
          rawUrl = 'https://' + rawUrl;
        }

        const hasCover = rawUrl.length > 0;

        return `
          <div class="card">
            <div class="card-body">
              <div class="card-info">
                ${book.codigo ? `<span class="tag-codigo">📍 ${book.codigo}</span>` : ''}
                <div class="card-title">${book.titulo || 'Sem título'}</div>
                <div class="card-author">${book.autor || 'Autor não informado'}</div>
                ${book.assunto ? `<span class="tag-assunto">📚 ${book.assunto}</span>` : ''}
              </div>
              <div class="cover-frame">
                ${hasCover ? `
                  <img src="${rawUrl}" 
                       alt="Capa" 
                       referrerpolicy="no-referrer"
                       onerror="this.classList.add('hide-img'); this.nextElementSibling.classList.remove('hide-placeholder');">
                  <span class="cover-placeholder hide-placeholder">📖</span>
                ` : `
                  <span class="cover-placeholder">📖</span>
                `}
              </div>
            </div>
            <div class="card-footer">
              <span>Lombada:</span>
              <strong>${book.corLombada || 'Não informada'}</strong>
            </div>
          </div>
        `;
      }).join('');
    }

    searchInput.addEventListener('input', () => {
      showAutocomplete();
      handleSearch();
    });

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
        suggestionsBox.style.display = 'none';
      }
    });

    loadData();
  </script>
</body>
</html>
